<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard — Game Builds</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">GAME BUILDS</a>

            <nav>
                <a href="index.html">Home</a>
                <button id="logout-button" class="nav-button">
                    Log out
                </button>
            </nav>
        </div>
    </header>

    <main>

        <section class="hero">
            <div class="hero-content">
                <span class="eyebrow">DASHBOARD</span>

                <h1 id="welcome-title">
                    Welcome.
                </h1>

                <p>
                    Manage your games and builds.
                </p>
            </div>
        </section>

        <section class="build-section">

            <div class="section-heading">
                <div>
                    <span class="eyebrow">YOUR GAMES</span>
                    <h2>Your games</h2>
                </div>

                <button id="add-game-button" class="btn primary">
                    Add game
                </button>
            </div>

            <div id="games-list" class="build-history">
                <p>Loading games...</p>
            </div>

        </section>

    </main>

    <footer class="footer">
        <p>Game Builds</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="dashboard.js"></script>

</body>
</html>
